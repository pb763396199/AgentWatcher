[package]
name = "agentwatcher"
version = "0.1.0"
description = "Windows floating session watcher for Copilot and Claude Code"
authors = ["AgentWatcher"]
edition = "2021"

[lib]
name = "agentwatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
