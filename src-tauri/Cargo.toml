[package]
name = "agentwatcher"
version = "0.1.6"
description = "Windows floating session watcher for Copilot, Claude Code, Codex, and OpenCode sessions"
authors = ["AgentWatcher"]
edition = "2021"
default-run = "agentwatcher"

[lib]
name = "agentwatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentwatcher-cli"
path = "src/bin/agentwatcher-cli/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
junction = "2.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
