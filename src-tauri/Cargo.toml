[package]
name = "agentwatcher"
version = "0.1.3"
description = "Windows floating session watcher for Copilot, Claude Code, and Codex sessions"
authors = ["AgentWatcher"]
edition = "2021"

[lib]
name = "agentwatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
