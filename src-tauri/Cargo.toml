[package]
name = "agentwatcher"
version = "0.1.11"
description = "Windows floating session watcher for Copilot, Claude Code, Codex, and OpenCode sessions"
authors = ["AgentWatcher"]
edition = "2021"
default-run = "agentwatcher"

[features]
# GUI 壳（Tauri 桌面端）默认开启，Windows 发布链路不变。
# headless CLI 构建用 `--no-default-features --bin agentwatcher-cli`，
# macOS 等平台先落 CLI，不拉 WebView 依赖，也不要求 ui-dist 前端产物。
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-opener"]

[lib]
name = "agentwatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentwatcher-cli"
path = "src/bin/agentwatcher-cli/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
# macos-private-api：主窗口 transparent: true 在 macOS 上必须启用（WKWebView 透明
# 依赖私有 API）；Windows 构建忽略该 feature。
tauri = { version = "2", features = ["macos-private-api"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
ruzstd = "0.9.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
# Unix 侧的进程组清理（kill -pgid）与 scan-cache 的 flock 独占锁。
libc = "0.2"
