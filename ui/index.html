<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentWatcher</title>
  <style>
    :root {
      --surface: #202020;
      --surface-2: #252526;
      --surface-3: #2d2d30;
      --border: #3c3c3c;
      --text: #d4d4d4;
      --muted: #9a9a9a;
      --soft: #6f6f6f;
      --accent: #0078d4;
      --focus: #0e639c;
      --waiting: #f14c4c;
      --running: #3794ff;
      --idle: #6a9955;
      --card: #1f1f1f;
      --shadow: none;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --columns: 2;
      --tile-padding: 8px;
      --tile-title: 12px;
      --tile-meta: 11px;
      --tile-provider: 22px;
    }

    body[data-theme="light"] {
      --surface: #f8f8f8;
      --surface-2: #ffffff;
      --surface-3: #eeeeee;
      --border: #d0d0d0;
      --text: #1f1f1f;
      --muted: #616161;
      --soft: #767676;
      --card: #ffffff;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      letter-spacing: 0;
    }

    body[data-theme="light"] .desktop { background: transparent; }

    body[data-theme="light"] .watcher-window,
    body[data-theme="light"] .compact-rail,
    body[data-theme="light"] .toast {
      background: #f8f8f8;
      color: #1f1f1f;
    }

    body[data-theme="light"] .native-titlebar,
    body[data-theme="light"] .app-header,
    body[data-theme="light"] .segmented,
    body[data-theme="light"] .control-strip,
    body[data-theme="light"] .queue-shell,
    body[data-theme="light"] .overflow-footer,
    body[data-theme="light"] .status-row {
      background: #f8f8f8;
    }

    body[data-theme="light"] .segment,
    body[data-theme="light"] .workspace-select,
    body[data-theme="light"] .preset-btn,
    body[data-theme="light"] .title-tool,
    body[data-theme="light"] .session-card,
    body[data-theme="light"] .rail-logo {
      background: #ffffff;
      color: #1f1f1f;
    }

    body[data-theme="light"] .rail-count.waiting {
      border-color: rgba(209, 52, 56, 0.64);
      background: #fff1f2;
      color: #a4262c;
    }

    body[data-theme="light"] .rail-count.running {
      border-color: rgba(0, 120, 212, 0.62);
      background: #eef6ff;
      color: #005a9e;
    }

    body[data-theme="light"] .rail-count.idle {
      border-color: rgba(76, 132, 42, 0.58);
      background: #f0f8ea;
      color: #3c6c1f;
    }

    body[data-theme="light"] .rail-count span {
      color: currentColor;
    }

    body[data-theme="light"] .provider {
      background: #ffffff;
    }

    body[data-theme="light"] .provider.gh {
      border-color: #0f8f7a;
      background: #eefaf7;
      color: #087568;
    }

    body[data-theme="light"] .provider.cl {
      border-color: #ce7248;
      background: #fff3ed;
      color: #9a4d25;
    }

    body[data-theme="light"] .lane-header {
      background: rgba(248, 248, 248, 0.96);
    }

    body[data-theme="light"] .workspace,
    body[data-theme="light"] .app-name strong,
    body[data-theme="light"] .window-title {
      color: #1f1f1f;
    }

    body[data-theme="light"] .session-title,
    body[data-theme="light"] .card-foot,
    body[data-theme="light"] .app-name span,
    body[data-theme="light"] .control-label,
    body[data-theme="light"] .queue-meta,
    body[data-theme="light"] .overflow-footer,
    body[data-theme="light"] .status-row,
    body[data-theme="light"] .size-value {
      color: #616161;
    }

    body[data-theme="light"] .urgent-chip {
      background: #fde7e9;
      color: #a4262c;
      border-color: #d13438;
    }

    body[data-theme="light"] .lane.waiting .lane-label,
    body[data-theme="light"] .lane.waiting .lane-note {
      color: #a4262c;
    }

    body[data-theme="light"] .lane.running .lane-label,
    body[data-theme="light"] .lane.running .lane-note {
      color: #005a9e;
    }

    body[data-theme="light"] .lane.idle .lane-label,
    body[data-theme="light"] .lane.idle .lane-note {
      color: #3c6c1f;
    }

    body[data-theme="light"] .queue-meta strong,
    body[data-theme="light"] .status-row strong {
      color: #1f1f1f;
    }

    button { font: inherit; }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-width: 0;
      min-height: 0;
      background: transparent;
    }

    .watcher-window {
      position: absolute;
      left: 70px;
      right: 8px;
      top: 8px;
      bottom: 8px;
      width: auto;
      height: auto;
      min-width: 0;
      min-height: 0;
      max-width: none;
      max-height: none;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    body.is-rail-only .watcher-window {
      display: none;
    }

    body.is-rail-only .compact-rail {
      left: 8px;
      top: 8px;
      height: 184px;
      opacity: 1;
    }

    .native-titlebar {
      height: 32px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: #1b1b1b;
      user-select: none;
    }

    .drag-region {
      height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 9px;
      min-width: 0;
      cursor: move;
    }

    .app-icon {
      width: 15px;
      height: 15px;
      border: 1px solid #1784d8;
      border-radius: 4px;
      background: linear-gradient(135deg, #0e639c, #252526 70%);
    }

    .window-title {
      overflow: hidden;
      color: #e7e7e7;
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .title-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding-right: 4px;
    }

    .title-tool {
      height: 22px;
      min-width: 32px;
      padding: 0 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #252526;
      color: #dcdcdc;
      cursor: pointer;
      font-size: 11px;
      line-height: 20px;
    }

    .title-tool:hover,
    .title-tool:focus-visible {
      outline: none;
      border-color: var(--focus);
      background: rgba(14, 99, 156, 0.25);
      color: #ffffff;
    }

    .window-controls {
      display: grid;
      grid-template-columns: repeat(2, 30px);
      height: 32px;
    }

    .win-btn {
      border: 0;
      background: transparent;
      color: #bbbbbb;
      cursor: pointer;
    }

    .win-btn:hover { background: #303030; color: #ffffff; }
    .win-btn.close:hover { background: #c42b1c; color: #ffffff; }

    .watcher-body {
      height: calc(100% - 32px);
      display: grid;
      grid-template-rows: 76px 40px 58px 1fr 30px;
      min-height: 0;
    }

    .app-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 10px 10px;
      border-bottom: 1px solid var(--border);
      background: #202020;
    }

    .app-name {
      min-width: 0;
    }

    .app-name strong {
      display: block;
      overflow: hidden;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-name span {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .urgent-chip {
      width: 104px;
      height: 30px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      border: 1px solid rgba(241, 76, 76, 0.72);
      border-radius: 6px;
      background: rgba(241, 76, 76, 0.13);
      color: #ffd0d0;
      font-size: 12px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .urgent-chip::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--waiting);
      animation: waitingPulse 1.5s ease-in-out infinite;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      padding: 7px 8px 6px;
      border-bottom: 1px solid var(--border);
      background: #1f1f1f;
    }

    .segment {
      height: 26px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #252526;
      color: #cfcfcf;
      cursor: pointer;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .segment.active {
      border-color: var(--focus);
      background: rgba(14, 99, 156, 0.25);
      color: #ffffff;
    }

    .control-strip {
      display: grid;
      grid-template-rows: 27px 30px;
      gap: 0;
      padding: 4px 8px 6px;
      border-bottom: 1px solid var(--border);
      background: #202020;
    }

    .workspace-row,
    .size-row {
      display: grid;
      grid-template-columns: minmax(54px, 64px) minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .control-label {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-select {
      width: 100%;
      height: 23px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #252526;
      color: #dcdcdc;
      font: inherit;
      font-size: 11px;
    }

    .size-tools {
      display: grid;
      grid-template-columns: minmax(60px, 72px) minmax(32px, 1fr) 34px;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .preset-btn {
      height: 23px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #252526;
      color: #dcdcdc;
      cursor: pointer;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preset-btn:hover,
    .preset-btn:focus-visible {
      outline: none;
      border-color: var(--focus);
      background: rgba(14, 99, 156, 0.25);
      color: #ffffff;
    }

    .size-range {
      width: 100%;
      accent-color: var(--accent);
    }

    .size-value {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    .queue-shell {
      min-height: 0;
      display: grid;
      grid-template-rows: 26px 1fr 28px;
      background: #1f1f1f;
    }

    .queue-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .queue-meta strong {
      color: #d7d7d7;
      font-weight: 650;
    }

    .session-scroll {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 10px 10px;
      scrollbar-width: thin;
      scrollbar-color: #5f5f5f #252526;
    }

    .session-scroll::-webkit-scrollbar { width: 10px; }
    .session-scroll::-webkit-scrollbar-track { background: #252526; }
    .session-scroll::-webkit-scrollbar-thumb {
      border: 2px solid #252526;
      border-radius: 999px;
      background: #5f5f5f;
    }

    .lane {
      margin-bottom: 10px;
    }

    .lane-header {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 -10px 8px;
      padding: 0 12px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(31, 31, 31, 0.96);
      backdrop-filter: blur(10px);
      color: #dcdcdc;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .lane-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .lane-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .lane.waiting .lane-label { color: #ffb7b7; }
    .lane.running .lane-label { color: #b9dcff; }
    .lane.idle .lane-label { color: #c5e8bb; }
    .lane.waiting .lane-dot { color: var(--waiting); }
    .lane.running .lane-dot { color: var(--running); }
    .lane.idle .lane-dot { color: var(--idle); }

    .cards {
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      gap: 7px;
    }

    .session-card {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      min-width: 0;
      padding: var(--tile-padding);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .session-card[hidden],
    .lane.is-hidden {
      display: none;
    }

    .session-card:hover,
    .session-card:focus-visible {
      outline: 1px solid var(--focus);
      background: #262626;
    }

    .session-card.waiting { border-color: rgba(241, 76, 76, 0.82); }
    .session-card.running { border-color: rgba(55, 148, 255, 0.82); }
    .session-card.idle { border-color: rgba(106, 153, 85, 0.62); opacity: 0.82; }

    .watcher-window.compact-cards .session-card {
      padding: 7px;
    }

    .watcher-window.compact-cards .card-head {
      margin-bottom: 5px;
      gap: 5px;
    }

    .watcher-window.compact-cards .workspace {
      margin-top: 5px;
      font-size: 11px;
      line-height: 14px;
    }

    .watcher-window.compact-cards .session-title {
      display: block;
      height: 14px;
      overflow: hidden;
      font-size: 10px;
      line-height: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
      -webkit-line-clamp: initial;
    }

    .watcher-window.compact-cards .card-foot {
      display: none;
    }

    .watcher-window.dense-cards .session-title {
      display: none;
    }

    .watcher-window.dense-cards .workspace {
      margin-top: 4px;
    }

    .watcher-window.micro-cards .session-title {
      display: none;
    }

    .watcher-window.micro-cards .session-card {
      display: grid;
      place-items: center;
      padding: 5px;
    }

    .watcher-window.micro-cards .provider {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      font-size: 8px;
    }

    .watcher-window.micro-cards .card-head {
      width: 100%;
      justify-content: center;
      margin: 0;
    }

    .watcher-window.micro-cards .time {
      display: none;
    }

    .watcher-window.micro-cards .workspace {
      display: none;
    }

    .watcher-window.micro-cards .card-foot {
      left: auto;
      right: 5px;
      bottom: 5px;
      width: 6px;
      height: 6px;
      display: block;
      font-size: 0;
    }

    .watcher-window.micro-cards .card-foot span {
      display: none;
    }

    .watcher-window.micro-cards .meter {
      width: 6px;
      height: 6px;
      display: block;
      border-radius: 50%;
      background: currentColor;
    }

    .watcher-window.micro-cards .meter::after {
      display: none;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      min-width: 0;
    }

    .provider {
      width: var(--tile-provider);
      height: var(--tile-provider);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #2b2b2b;
      font-size: max(9px, calc(var(--tile-provider) * 0.45));
      font-weight: 700;
    }

    .provider.gh { color: #4ec9b0; border-color: #4ec9b0; }
    .provider.cl { color: #ce9178; border-color: #ce9178; }
    .time {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: max(9px, calc(var(--tile-meta) - 1px));
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace {
      margin-top: 8px;
      overflow: hidden;
      color: #ffffff;
      font-size: var(--tile-title);
      font-weight: 700;
      line-height: calc(var(--tile-title) + 3px);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-title {
      display: -webkit-box;
      height: calc((var(--tile-meta) + 4px) * 2);
      margin-top: 3px;
      overflow: hidden;
      color: #c0c0c0;
      font-size: var(--tile-meta);
      line-height: calc(var(--tile-meta) + 4px);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .card-foot {
      position: absolute;
      left: var(--tile-padding);
      right: var(--tile-padding);
      bottom: var(--tile-padding);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      color: var(--muted);
      font-size: max(9px, calc(var(--tile-meta) - 1px));
      min-width: 0;
    }

    .card-foot span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meter {
      position: relative;
      width: 34px;
      height: 3px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 99px;
      background: #3a3a3a;
    }

    .meter::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 56%;
      border-radius: inherit;
      background: currentColor;
    }

    .session-card.waiting .meter { color: var(--waiting); }
    .session-card.running .meter { color: var(--running); }
    .session-card.idle .meter { color: var(--idle); }
    .session-card.running .meter::after { animation: runningMeter 1.2s ease-in-out infinite alternate; }
    .session-card.waiting .meter::after { width: 100%; animation: waitingMeter 1.4s ease-in-out infinite; }

    .overflow-footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-top: 1px solid var(--border);
      background: #202020;
      color: var(--muted);
      font-size: 11px;
    }

    .overflow-map {
      width: 90px;
      height: 8px;
      display: grid;
      grid-template-columns: 8fr 12fr 31fr;
      overflow: hidden;
      border: 1px solid #444444;
      border-radius: 99px;
      background: #2b2b2b;
    }

    .overflow-map span:nth-child(1) { background: var(--waiting); }
    .overflow-map span:nth-child(2) { background: var(--running); }
    .overflow-map span:nth-child(3) { background: var(--idle); }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-top: 1px solid var(--border);
      background: #1b1b1b;
      color: var(--muted);
      font-size: 11px;
    }

    .status-row strong { color: #dcdcdc; font-weight: 600; }

    .compact-rail {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 52px;
      height: 184px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #202020;
      box-shadow: none;
      transition: opacity 120ms ease;
    }

    .rail-logo {
      width: 30px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .rail-counts {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .rail-count {
      width: 34px;
      height: 27px;
      display: grid;
      grid-template-columns: 7px 1fr;
      align-items: center;
      gap: 5px;
      padding: 0 5px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #252526;
      color: #dcdcdc;
      font-size: 11px;
      font-weight: 700;
    }

    .rail-count::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .rail-count.waiting { color: var(--waiting); }
    .rail-count.running { color: var(--running); }
    .rail-count.idle { color: var(--idle); }
    .rail-count span { color: #dcdcdc; }

    .toast {
      position: absolute;
      left: 70px;
      right: 8px;
      bottom: 12px;
      width: auto;
      min-height: 42px;
      display: none;
      align-items: center;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #252526;

    async function resizeWatcherFromPointer(event) {
      const direction = event.currentTarget.dataset.resize;
      event.preventDefault();
      const resizeDirections = { nw: 'NorthWest', ne: 'NorthEast', sw: 'SouthWest', se: 'SouthEast' };
      if (!tauriWindow) {
        showToast(t('windowSize') + ': ' + window.innerWidth + ' x ' + window.innerHeight);
        return;
      }

      try {
        await tauriWindow.startResizeDragging(resizeDirections[direction]);
      } catch (error) {
        showToast(String(error));
      }

    async function startWindowDrag(event) {
      if (event.button !== 0 || event.target.closest('button, select, input, .rail-logo')) return;
      if (!tauriWindow) return;
      event.preventDefault();

      const captureTarget = event.currentTarget;
      if (captureTarget?.setPointerCapture && event.pointerId !== undefined) {
        try {
          captureTarget.setPointerCapture(event.pointerId);
        } catch (error) {
          // Pointer capture is a best-effort guard against losing pointerup while moving.
        }
      }

      const startPosition = await tauriWindow.outerPosition();
      const scaleFactor = await tauriWindow.scaleFactor();
      const startScreenX = event.screenX;
      const startScreenY = event.screenY;
      let pendingMove = null;
      let moveQueued = false;
      let isDragging = true;

      async function applyPendingMove() {
        if (!isDragging) return;

        const moveEvent = pendingMove;
        pendingMove = null;

        if (moveEvent) {
          const nextX = Math.round(startPosition.x + (moveEvent.screenX - startScreenX) * scaleFactor);
          const nextY = Math.round(startPosition.y + (moveEvent.screenY - startScreenY) * scaleFactor);
          try {
            await tauriWindow.setPosition(new PhysicalPositionClass(nextX, nextY));
          } catch (error) {
            stopWindowDrag();
            showToast(String(error));
            return;
          }
        }

        if (pendingMove) {
          requestAnimationFrame(applyPendingMove);
        } else {
          moveQueued = false;
        }
      }

      function onPointerMove(moveEvent) {
        if (!isDragging) return;
        moveEvent.preventDefault();
        pendingMove = moveEvent;
        if (!moveQueued) {
          moveQueued = true;
          requestAnimationFrame(applyPendingMove);
        }
      }

      function stopWindowDrag() {
        if (!isDragging) return;
        isDragging = false;
        pendingMove = null;
        window.removeEventListener('pointermove', onPointerMove, true);
        window.removeEventListener('pointerup', stopWindowDrag, true);
        window.removeEventListener('pointercancel', stopWindowDrag, true);
        window.removeEventListener('blur', stopWindowDrag, true);

        if (captureTarget?.releasePointerCapture && event.pointerId !== undefined) {
          try {
            captureTarget.releasePointerCapture(event.pointerId);
          } catch (error) {
            // Capture may already be released by the browser.
          }
        }
      }

      window.addEventListener('pointermove', onPointerMove, true);
      window.addEventListener('pointerup', stopWindowDrag, true);
      window.addEventListener('pointercancel', stopWindowDrag, true);
      window.addEventListener('blur', stopWindowDrag, true);
    }

    async function runWindowAction(action) {
      if (action === 'minimize') {
        setRailOnly(true);
        return;
      }

      if (!tauriWindow) {
        showToast('Tauri window API unavailable in browser preview');
        return;
      }

      try {
        if (action === 'close') await tauriWindow.close();
      } catch (error) {
        showToast(String(error));
      }
    }

    function applyFilters() {
      const selectedWorkspace = workspaceFilter.value;
      const selectedStatus = activeStatus();
      const laneCounts = { waiting: 0, running: 0, idle: 0 };
      let actualVisible = 0;

      cards.forEach(card => {
        const workspace = card.dataset.workspace;
        const status = cardStatus(card);
        const matchesWorkspace = !selectedWorkspace || workspace === selectedWorkspace;
        const matchesStatus = selectedStatus === 'all' || selectedStatus === status;
        const shouldShow = matchesWorkspace && matchesStatus;
        card.hidden = !shouldShow;
        if (shouldShow) {
          actualVisible += 1;
          laneCounts[status] += 1;
        }
      });

      lanes.forEach(lane => {
        const status = lane.dataset.status;
        const laneTotal = selectedWorkspace ? laneCounts[status] : Number(lane.dataset.total);
        const laneAllowed = selectedStatus === 'all' || selectedStatus === status;
        const count = laneAllowed ? laneTotal : 0;
        lane.querySelector('.lane-count').textContent = String(count);
        lane.classList.toggle('is-hidden', count === 0);
      });

      const logicalTotal = selectedWorkspace ? actualVisible : logicalTotals[selectedStatus];
      const visibleCount = Math.min(9, logicalTotal);
      const queueCount = Math.max(0, logicalTotal - visibleCount);

      visibleNow.textContent = String(visibleCount);
      queueNow.textContent = String(queueCount);
      sessionTotal.textContent = String(logicalTotal);
      appTitle.textContent = selectedWorkspace || t('allSessions');
      appSubtitle.textContent = selectedWorkspace ? t('filterActive') : t('watched');
      filterState.textContent = selectedWorkspace ? t('workspacePrefix') + selectedWorkspace : t('updated');
      sessionScroll.scrollTop = 0;
      requestAnimationFrame(syncCardScale);
    }

    cards.forEach(card => {
      card.dataset.workspace = card.dataset.open;
    });

    [...new Set(cards.map(card => card.dataset.workspace))]
      .sort((left, right) => left.localeCompare(right))
      .forEach(workspace => {
        const option = document.createElement('option');
        option.value = workspace;
        option.textContent = workspace;
        workspaceFilter.appendChild(option);
      });

    document.querySelectorAll('.session-card').forEach(card => {
      card.addEventListener('click', () => showToast(t('openWorkspace') + card.dataset.open));
    });

    document.querySelectorAll('.segment').forEach(segment => {
      segment.addEventListener('click', () => {
        document.querySelectorAll('.segment').forEach(item => item.classList.remove('active'));
        segment.classList.add('active');
        applyFilters();
      });
    });

    workspaceFilter.addEventListener('change', applyFilters);
    sizeRange.addEventListener('input', event => setIconsPerRow(event.target.value, false));
    sizePreset.addEventListener('click', () => {
      const current = Number(sizeRange.value);
      const nextColumns = columnPresets[(columnPresets.indexOf(current) + 1) % columnPresets.length];
      setIconsPerRow(nextColumns, true);
    });
    languageToggle.addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      applyLanguage();
      setIconsPerRow(sizeRange.value, false);
      applyFilters();
    });
    themeToggle.addEventListener('click', () => {
      const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      document.body.dataset.theme = nextTheme;
      applyLanguage();
      showToast(nextTheme === 'light' ? t('themeLight') : t('themeDark'));
    });
    [dragRegion, document.querySelector('.native-titlebar'), appHeader, compactRail].forEach(source => source?.addEventListener('pointerdown', startWindowDrag));
    windowActionButtons.forEach(button => button.addEventListener('click', () => runWindowAction(button.dataset.windowAction)));
    railLogo.addEventListener('click', () => {
      if (document.body.classList.contains('is-rail-only')) setRailOnly(false);
    });
    railLogo.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      if (document.body.classList.contains('is-rail-only')) setRailOnly(false);
    });
    resizeHandles.forEach(handle => handle.addEventListener('pointerdown', resizeWatcherFromPointer));

    new ResizeObserver(() => {
      requestAnimationFrame(syncCardScale);
      requestAnimationFrame(syncCompactRail);
    }).observe(watcherWindow);
    window.addEventListener('resize', () => requestAnimationFrame(syncCompactRail));
    applyLanguage();
    setIconsPerRow(sizeRange.value, false);
    applyFilters();
    syncCompactRail();
  </script>
</body>
</html>
